[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roadtoken3d-ascend"
version = "0.2.0"
description = "RoadToken3D Ascend NPU implementation preview"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "torch>=2.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
